tr.applied{background:#ecfdf5} tr.wait{background:#fffbeb} tr.win{background:#eff6ff} tr.lose{background:#fef2f2}
a{color:#2563eb;text-decoration:none;font-weight:600}
.notice{font-size:12px;color:#666;margin-top:10px}

<script>
const KEY="radio_kanban_apply_v1";
const formUrl='https://forms.gle/BFZUx4Q9tZvAFYvG7';
const trs=[...document.querySelectorAll("tbody tr")];

function save(){
 const data=trs.map(tr=>({
   store:tr.dataset.store,
   applied:tr.querySelector(".applied").checked,
   datetime:tr.querySelector(".datetime").value,
   result:tr.querySelector(".result").value,
   memo:tr.querySelector(".memo").value
 }));
 localStorage.setItem(KEY,JSON.stringify(data));
 update();
}
function load(){
 const raw=localStorage.getItem(KEY);
 if(raw){
   const data=JSON.parse(raw);
   data.forEach(d=>{
     const tr=trs.find(x=>x.dataset.store===d.store); if(!tr)return;
     tr.querySelector(".applied").checked=!!d.applied;
     tr.querySelector(".datetime").value=d.datetime||"";
     tr.querySelector(".result").value=d.result||"未確認";
     tr.querySelector(".memo").value=d.memo||"";
   });
 }
 trs.forEach(tr=>tr.querySelectorAll("input,select").forEach(el=>el.addEventListener("change",save)));
 update();
}
function update(){
 let a=0,w=0,win=0;
 trs.forEach(tr=>{
   const checked=tr.querySelector(".applied").checked;
   const r=tr.querySelector(".result").value;
   tr.className=checked?"applied":"";
   if(r==="結果待ち"){tr.classList.add("wait");w++}
   if(r==="当選"){tr.classList.add("win");win++}
   if(r==="落選")tr.classList.add("lose");
   if(checked)a++;
 });
 document.getElementById("appliedCount").textContent=a;
 document.getElementById("notAppliedCount").textContent=trs.length-a;
 document.getElementById("waitCount").textContent=w;
 document.getElementById("winCount").textContent=win;
}
function filter(fn){trs.forEach(tr=>tr.style.display=fn(tr)?"":"none")}
function showAll(){filter(()=>true)}
function showUnapplied(){filter(tr=>!tr.querySelector(".applied").checked)}
function showApplied(){filter(tr=>tr.querySelector(".applied").checked)}
function openForm(){window.open(formUrl,"_blank","noopener")}
function resetAll(){if(confirm("保存している応募状況を全て消します。よろしいですか？")){localStorage.removeItem(KEY);location.reload()}}
function exportCSV(){
 const head=["応募先","応募済","応募日時","結果","応募フォームURL","メモ"];
 const data=trs.map(tr=>[
   tr.dataset.store,
   tr.querySelector(".applied").checked?"応募済":"未応募",
   tr.querySelector(".datetime").value,
   tr.querySelector(".result").value,
   formUrl,
   tr.querySelector(".memo").value
 ]);
 const esc=v=>'"'+String(v).replaceAll('"','""')+'"';
 const csv="\uFEFF"+[head,...data].map(r=>r.map(esc).join(",")).join("\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="応募管理.csv";a.click();
}
load();
</script>
